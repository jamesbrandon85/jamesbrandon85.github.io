<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-41R5SMCXT3"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-41R5SMCXT3');
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }} | James Brandon Photography</title>
<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
<link rel="canonical" href="{{ page.url | prepend: site.url }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | prepend: site.url }}">
<meta property="og:title" content="{{ page.title }} | James Brandon Photography">
<meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
{% if page.image %}<meta property="og:image" content="{{ page.image | prepend: site.url }}">{% endif %}
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --dark: #0d0d0d; --dark2: #1a1a1a; --light: #f5f5f0; --accent: #c9a96e; --text-muted: #888; --white: #ffffff; }
html { scroll-behavior: smooth; }
body { font-family: 'Inter', sans-serif; background: var(--dark); color: var(--light); overflow-x: hidden; }
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 20px 48px; background: rgba(13,13,13,0.97); backdrop-filter: blur(10px); box-shadow: 0 1px 0 rgba(255,255,255,0.06); }
.nav-logo img { height: 32px; width: auto; display: block; }
.nav-links { display: flex; gap: 40px; list-style: none; }
.nav-links a { font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.8); text-decoration: none; transition: color 0.2s; }
.nav-links a:hover, .nav-links a.active { color: var(--accent); }
.hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; padding: 4px; }
.hamburger span { display: block; width: 22px; height: 2px; background: var(--white); transition: all 0.3s; }
footer { border-top: 1px solid rgba(255,255,255,0.08); padding: 40px 48px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
.footer-copy { font-size: 12px; color: var(--text-muted); }
.footer-links { display: flex; gap: 24px; }
.footer-links a { font-size: 12px; color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
.footer-links a:hover { color: var(--accent); }
@media (max-width: 768px) {
  nav { padding: 16px 24px; }
  .nav-links { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--dark); flex-direction: column; align-items: center; justify-content: center; gap: 32px; z-index: 99; }
  .nav-links.open { display: flex; }
  .hamburger { display: flex; z-index: 101; }
  footer { padding: 32px 24px; flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo"><img src="/jamesb-logo-white.png" alt="James Brandon Photography"></a>
  <button class="hamburger" id="hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  <ul class="nav-links" id="navLinks">
    <li><a href="/#about">About</a></li>
    <li><a href="/#gallery">Gallery</a></li>
    <li><a href="/#prints">Prints</a></li>
    <li><a href="/#workshops">Workshops</a></li>
    <li><a href="/blog/" {% if page.url contains '/blog/' %}class="active"{% endif %}>Blog</a></li>
    <li><a href="/#contact">Contact</a></li>
  </ul>
</nav>
{{ content }}
<footer>
  <span class="footer-copy">&copy; {{ 'now' | date: "%Y" }} James Brandon Photography. All rights reserved.</span>
  <div class="footer-links">
    <a href="/blog/">Blog</a>
    <a href="/#contact">Contact</a>
  </div>
</footer>
<script>
const hamburger = document.getElementById('hamburger');
const navLinks = document.getElementById('navLinks');
if (hamburger) {
  hamburger.addEventListener('click', () => {
    navLinks.classList.toggle('open');
    hamburger.classList.toggle('open');
  });
}
</script>
</body>
</html>
